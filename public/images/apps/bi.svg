  <rect x="12" y="86" width="106" height="24" rx="5" fill="#4338CA" fill-opacity="0.12"/>
  <rect x="20" y="93" width="10" height="10" rx="2" fill="#4338CA"/>
  <rect x="36" y="94" width="65" height="8" rx="2" fill="#4338CA"/>

