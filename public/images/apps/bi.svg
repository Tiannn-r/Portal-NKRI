    <rect x="470" y="319" width="35" height="5" rx="1.5" fill="#94A3B8"/>
    <rect x="566" y="309" width="44" height="14" rx="3" fill="#DCFCE7"/>
    <text x="572" y="319" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#166534" font-weight="700">SUKSES</text>
