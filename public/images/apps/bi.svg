      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="primary-bi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="shadow-bi" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Browser Window Chrome -->
  <rect width="640" height="360" rx="8" fill="url(#bg-bi)"/>
  <rect width="640" height="34" rx="8" fill="#FFFFFF"/>
